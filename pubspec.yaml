name: royal_college_student_app
description: Royal College of Arts and Science Student App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "web/icons/Icon-512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
